name: CI

on:
  push:
    branches: [Beta]
  pull_request:
    branches: [Beta]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

      - name: TypeScript check
        run: npm run typecheck
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          ADMIN_EMAIL: ci@example.invalid
          ADMIN_PASSWORD: ci-only-password-not-used-at-runtime
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          BLOG_DEMO: "1"
          NEXT_TELEMETRY_DISABLED: "1"
