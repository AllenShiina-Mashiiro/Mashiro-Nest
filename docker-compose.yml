# 本地基础设施：PostgreSQL + Redis + MinIO（S3 兼容）
# 用法：docker compose up -d
# 然后在 .env 中启用对应的连接串。

services:
  db:
    image: postgres:16-alpine
    container_name: mizuki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mizuki
      POSTGRES_PASSWORD: mizuki
      POSTGRES_DB: mizuki
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - mizuki_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizuki -d mizuki"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mizuki-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - mizuki_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mizuki-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mizuki
      MINIO_ROOT_PASSWORD: mizuki123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mizuki_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 创建桶并开放匿名读（仅本地开发）
  minio-init:
    image: minio/mc:latest
    container_name: mizuki-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 mizuki mizuki123; do sleep 2; done;
      mc mb --ignore-existing local/mizuki-media;
      mc anonymous set download local/mizuki-media;
      echo 'bucket ready';
      "

volumes:
  mizuki_pgdata:
  mizuki_redisdata:
  mizuki_minio:
