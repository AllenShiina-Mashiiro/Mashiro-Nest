# Production-ready single-instance stack.
# 1) Copy .env.example to .env and set unique passwords/secrets.
# 2) Start the database services: docker compose up -d db redis
# 3) Initialize the schema: docker compose --profile tools run --rm --build db-tools
# 4) Create the administrator: docker compose --profile tools run --rm db-tools npm run db:admin
# 5) Start the web app: docker compose up -d --build app
#
# Optional demo content:
# docker compose --profile tools run --rm db-tools npm run db:seed
#
# PostgreSQL and Redis ports are bound to localhost only. Put the app behind
# an HTTPS reverse proxy (Caddy, Nginx, Traefik, etc.) in production.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env}
    image: mashiro-nest:latest
    container_name: mashiro-nest-app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mashiro}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-mashiro}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - mashiro_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  # One-off maintenance container. It includes Prisma CLI and tsx from devDependencies,
  # but is excluded from the default `docker compose up` because it uses a profile.
  db-tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: db-tools
    image: mashiro-nest-tools:latest
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mashiro}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-mashiro}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16-alpine
    container_name: mashiro-nest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mashiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mashiro}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - mashiro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mashiro} -d ${POSTGRES_DB:-mashiro}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: mashiro-nest-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - mashiro_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  mashiro_pgdata:
  mashiro_redisdata:
  mashiro_uploads:
